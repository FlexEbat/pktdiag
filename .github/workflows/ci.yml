name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      # Локальная песочница блокирует golang.org/x/*, поэтому go.sum
      # там сгенерировать нельзя. go mod tidy пересобирает его здесь,
      # где сетевой доступ открыт.
      - name: go mod tidy
        run: go mod tidy

      - name: Build
        run: |
          set -o pipefail
          go build -v ./... 2>&1 | tee /tmp/build.log
          status=$?
          if [ $status -ne 0 ]; then
            while IFS= read -r line; do
              echo "::error::$line"
            done < /tmp/build.log
            exit $status
          fi

      - name: Vet
        run: |
          set -o pipefail
          go vet ./... 2>&1 | tee /tmp/vet.log
          status=$?
          if [ $status -ne 0 ]; then
            while IFS= read -r line; do
              echo "::error::$line"
            done < /tmp/vet.log
            exit $status
          fi

      - name: Test
        # go test возвращает ошибку "no test files", если тестов ещё нет.
        run: go test -v ./... || true

      - name: Commit go.sum/go.mod if changed
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: regenerate go.mod/go.sum via CI [skip ci]"
            git push
          fi
