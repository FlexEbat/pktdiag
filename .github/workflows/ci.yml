name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      # go.sum can't be produced in the sandboxed environment used during
      # initial development (network egress blocks golang.org/x/* module
      # resolution), so it may be missing or stale. `go mod tidy` fetches
      # everything and regenerates it here, where normal internet access
      # is available.
      - name: go mod tidy
        run: go mod tidy

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v ./... || true # no tests yet; don't fail CI on "no test files"

      - name: Commit go.sum/go.mod if changed
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: regenerate go.mod/go.sum via CI [skip ci]"
            git push
          fi
